<!DOCTYPE html>
<html lang="he" dir="rtl" data-playback-mode="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Interactive signed-numbers simulator by Fundamatics"
  />

  <title>מספרים מכוונים — להרגיש את התרגיל דרך הגוף — Fundamatics</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="icon"
    href="assets/brand/fundamatics-full-logo-white.svg"
    type="image/svg+xml"
  />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&amp;family=Montserrat:wght@600;700;800&amp;family=Noto+Sans+Hebrew:wght@400;600;700;800&amp;display=swap"
  />
  <link rel="stylesheet" href="css/style.css?v=mobile-number-steppers-1" />
</head>

<body>
  <div id="app">
    <header
      id="app-header"
      class="app-header"
      data-i18n-aria-label="header.aria"
    >
      <div class="brand-product-lockup">
        <a
          class="fundamatics-brand"
          href="https://fundamatics.com/"
          aria-label="Fundamatics — Maths for life"
        >
          <img
            src="assets/brand/fundamatics-full-logo-white.svg"
            alt="Fundamatics"
          />
          <span class="brand-tagline">Maths for life</span>
        </a>
        <div class="product-identity">
          <h1 data-i18n="header.title">
            מספרים מכוונים — להרגיש את התרגיל דרך הגוף
          </h1>
          <p data-i18n="header.subtitle">
            סימולטור גופני ללימוד חיבור וחיסור של מספרים מכוונים
          </p>
        </div>
      </div>

      <div class="header-actions">
        <button
          id="soundToggleButton"
          class="sound-toggle"
          type="button"
          aria-pressed="false"
          data-i18n="sound.off"
        >
          🔇 קול כבוי
        </button>
        <div
          class="language-switcher"
          role="group"
          data-i18n-aria-label="language.label"
        >
          <button
            class="language-option"
            type="button"
            data-locale="he"
            lang="he"
          >
            עברית
          </button>
          <button
            class="language-option"
            type="button"
            data-locale="en"
            lang="en"
          >
            English
          </button>
        </div>

        <a
          class="fundamatics-home-link"
          href="https://fundamatics.com/"
          data-i18n="header.home"
        >
          חזרה ל־Fundamatics
        </a>
      </div>
    </header>

    <main>
      <section
        class="classroom"
        data-i18n-aria-label="classroom.aria"
      >
        <div class="front-wall">
          <div
            class="clock"
            role="img"
            data-i18n-aria-label="classroom.clock"
          ></div>
          <div
            class="window"
            role="img"
            data-i18n-aria-label="classroom.window"
          ></div>

          <div class="board">
            <div class="board-title" data-i18n="board.title">
              כתבו את התרגיל
            </div>

            <section
              class="controls board-controls"
              data-i18n-aria-label="controls.aria"
            >
              <div class="field field-first">
                <label
                  id="firstNumberLabel"
                  for="firstNumber"
                  data-i18n="controls.firstNumber"
                >
                  הכניסו את המספר הראשון
                </label>
                <div
                  class="number-stepper"
                  role="group"
                  aria-labelledby="firstNumberLabel"
                >
                  <button
                    class="number-stepper-button"
                    type="button"
                    data-step-input="firstNumber"
                    data-step-direction="decrement"
                    data-i18n-aria-label="controls.decrementFirst"
                    aria-controls="firstNumber"
                  >
                    −
                  </button>
                  <input
                    id="firstNumber"
                    type="number"
                    value="0"
                    min="-30"
                    max="30"
                    step="1"
                    inputmode="numeric"
                  />
                  <button
                    class="number-stepper-button"
                    type="button"
                    data-step-input="firstNumber"
                    data-step-direction="increment"
                    data-i18n-aria-label="controls.incrementFirst"
                    aria-controls="firstNumber"
                  >
                    +
                  </button>
                </div>
              </div>

              <div class="field field-operator">
                <label for="operator" data-i18n="controls.operation">
                  בחרו את הפעולה
                </label>
                <select id="operator">
                  <option value="+">+</option>
                  <option value="-">−</option>
                </select>
              </div>

              <div class="field field-second">
                <label
                  id="secondNumberLabel"
                  for="secondNumber"
                  data-i18n="controls.secondNumber"
                >
                  הכניסו את המספר השני
                </label>
                <div
                  class="number-stepper"
                  role="group"
                  aria-labelledby="secondNumberLabel"
                >
                  <button
                    class="number-stepper-button"
                    type="button"
                    data-step-input="secondNumber"
                    data-step-direction="decrement"
                    data-i18n-aria-label="controls.decrementSecond"
                    aria-controls="secondNumber"
                  >
                    −
                  </button>
                  <input
                    id="secondNumber"
                    type="number"
                    value="0"
                    min="-30"
                    max="30"
                    step="1"
                    inputmode="numeric"
                  />
                  <button
                    class="number-stepper-button"
                    type="button"
                    data-step-input="secondNumber"
                    data-step-direction="increment"
                    data-i18n-aria-label="controls.incrementSecond"
                    aria-controls="secondNumber"
                  >
                    +
                  </button>
                </div>
              </div>

              <button
                id="startButton"
                type="button"
                data-i18n="controls.start"
              >
                פתור תרגיל
              </button>
              <button
                id="resetButton"
                class="reset-button"
                type="button"
                data-i18n="controls.reset"
              >
                איפוס
              </button>
              <button
                id="randomButton"
                class="random-button"
                type="button"
                data-i18n="controls.random"
              >
                תרגיל אקראי
              </button>
            </section>

            <div class="board-display">
              <div
                id="boardExercise"
                class="board-exercise"
                aria-live="polite"
              >
                <span data-expression-part="first">0</span>
                <span data-expression-part="operator">+</span>
                <span data-expression-part="second">0</span>
                <span data-expression-part="result" hidden></span>
              </div>
            </div>

            <div
              id="message"
              class="message board-message"
              role="status"
              aria-live="polite"
            ></div>

            <div
              class="playback-controls"
              role="group"
              data-i18n-aria-label="playback.aria"
            >
              <div
                class="playback-mode-switch"
                role="group"
                data-i18n-aria-label="playback.mode.label"
              >
                <button
                  class="playback-mode-option is-active"
                  type="button"
                  data-playback-mode="auto"
                  data-i18n="playback.mode.auto"
                >
                  הפעלה אוטומטית
                </button>
                <button
                  class="playback-mode-option"
                  type="button"
                  data-playback-mode="manual"
                  data-i18n="playback.mode.manual"
                >
                  צעד־אחר־צעד
                </button>
              </div>
              <button
                id="previousStepButton"
                class="playback-button"
                type="button"
                data-i18n-aria-label="playback.previous"
              >
                ⏮
              </button>
              <button
                id="playButton"
                class="playback-button playback-primary playback-text-button"
                type="button"
                data-i18n-aria-label="playback.play"
                data-i18n="playback.continue"
              >
                המשך
              </button>
              <button
                id="pauseButton"
                class="playback-button"
                type="button"
                data-i18n-aria-label="playback.pause"
              >
                ⏸
              </button>
              <button
                id="nextStepButton"
                class="playback-button playback-text-button"
                type="button"
                data-i18n-aria-label="playback.next"
                data-i18n="playback.continue"
              >
                המשך
              </button>
              <input
                id="playbackProgress"
                class="playback-progress"
                type="range"
                min="0"
                max="9"
                value="0"
                step="1"
                data-i18n-aria-label="playback.progress"
              />
              <output id="playbackCounter" class="playback-counter">
                0 / 9
              </output>
            </div>

            <div id="completionActions" class="completion-actions" hidden>
              <button id="newExerciseButton" type="button" data-i18n="completion.new">
                תרגיל חדש
              </button>
              <button id="completionRandomButton" type="button" data-i18n="controls.random">
                תרגיל אקראי
              </button>
              <button id="replayButton" type="button" data-i18n="completion.replay">
                הפעל שוב
              </button>
            </div>
          </div>

          <div class="front-people">
            <div class="person teacher">
              <div
                id="speechBubble"
                class="speech-bubble teacher-speech-bubble"
                aria-live="polite"
              ></div>
              <div class="head"><div class="hair"></div></div>
              <div class="body"></div>
              <div class="legs"></div>
              <div class="person-label" data-i18n="people.teacher">
                המורה
              </div>
            </div>

            <div id="standingStudent" class="person active-student">
              <div class="head">
                <div class="hair"></div>
                <span class="student-ear student-ear-left"></span>
                <span class="student-ear student-ear-right"></span>
                <div class="student-face">
                  <span class="student-eye student-eye-left"></span>
                  <span class="student-eye student-eye-right"></span>
                  <span class="student-nose"></span>
                  <span class="student-mouth"></span>
                </div>
              </div>
              <div class="body"></div>
              <div class="legs"></div>
              <div class="person-label" data-i18n="people.student">
                התלמיד
              </div>
            </div>
          </div>
        </div>

        <div
          id="studentSpeechBubble"
          class="speech-bubble student-speech-bubble"
          aria-live="polite"
          hidden
        ></div>

        <div class="number-line-area">
          <div
            id="numberLine"
            class="number-line"
            role="img"
            data-i18n-aria-label="numberLine.aria"
          >
            <div
              id="movingStudent"
              class="moving-student"
              data-facing="front"
            >
              <div id="turnIndicator" class="turn-indicator" hidden></div>
              <div id="stepCounter" class="step-counter" hidden></div>
              <div class="student-pose">
                <div class="head">
                  <div class="hair"></div>
                  <span class="student-ear student-ear-left"></span>
                  <span class="student-ear student-ear-right"></span>
                  <div class="student-face">
                    <span class="student-eye student-eye-left"></span>
                    <span class="student-eye student-eye-right"></span>
                    <span class="student-nose"></span>
                    <span class="student-mouth"></span>
                  </div>
                </div>
                <div class="body"></div>
                <div class="legs"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="floor">
          <div
            id="studentDesks"
            class="student-desks"
            data-i18n-aria-label="classroom.students"
          ></div>
        </div>
      </section>

    </main>
  </div>

  <script src="js/i18n.js?v=mobile-number-steppers-1"></script>
  <script src="js/app.js?v=mobile-number-steppers-1"></script>
</body>
</html>
