<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Interactive signed-numbers simulator by Fundamatics"
  />

  <title>מספרים מכוונים — Fundamatics</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="icon"
    href="assets/brand/fundamatics-full-logo-white.svg"
    type="image/svg+xml"
  />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&amp;family=Montserrat:wght@600;700;800&amp;family=Noto+Sans+Hebrew:wght@400;600;700;800&amp;display=swap"
  />
  <link rel="stylesheet" href="css/style.css?v=bilingual-1" />
</head>

<body>
  <div id="app">
    <header
      id="app-header"
      class="app-header"
      data-i18n-aria-label="header.aria"
    >
      <div class="brand-product-lockup">
        <a
          class="fundamatics-brand"
          href="https://fundamatics.com/"
          aria-label="Fundamatics — Maths for life"
        >
          <img
            src="assets/brand/fundamatics-full-logo-white.svg"
            alt="Fundamatics"
          />
          <span class="brand-tagline">Maths for life</span>
        </a>

        <span class="brand-divider" aria-hidden="true">/</span>

        <div class="product-identity">
          <h1 data-i18n="header.title">מספרים מכוונים</h1>
          <p data-i18n="header.subtitle">
            סימולטור גופני ללימוד חיבור וחיסור של מספרים מכוונים
          </p>
        </div>
      </div>

      <div class="header-actions">
        <div
          class="language-switcher"
          role="group"
          data-i18n-aria-label="language.label"
        >
          <button
            class="language-option"
            type="button"
            data-locale="he"
            lang="he"
          >
            עברית
          </button>
          <button
            class="language-option"
            type="button"
            data-locale="en"
            lang="en"
          >
            English
          </button>
        </div>

        <a
          class="fundamatics-home-link"
          href="https://fundamatics.com/"
          data-i18n="header.home"
        >
          חזרה ל־Fundamatics
        </a>
      </div>
    </header>

    <main>
      <section
        class="controls"
        data-i18n-aria-label="controls.aria"
      >
        <div class="field">
          <label for="firstNumber" data-i18n="controls.firstNumber">
            המספר הראשון
          </label>
          <input
            id="firstNumber"
            type="number"
            value="0"
            min="-30"
            max="30"
            step="1"
            inputmode="numeric"
          />
        </div>

        <div class="field field-operator">
          <label for="operator" data-i18n="controls.operation">הפעולה</label>
          <select id="operator">
            <option value="+">+</option>
            <option value="-">−</option>
          </select>
        </div>

        <div class="field">
          <label for="secondNumber" data-i18n="controls.secondNumber">
            המספר השני
          </label>
          <input
            id="secondNumber"
            type="number"
            value="3"
            min="-30"
            max="30"
            step="1"
            inputmode="numeric"
          />
        </div>

        <button id="startButton" type="button" data-i18n="controls.start">
          הפעלת התרגיל
        </button>
        <button
          id="resetButton"
          class="reset-button"
          type="button"
          data-i18n="controls.reset"
        >
          איפוס
        </button>
      </section>

      <div
        id="message"
        class="message"
        role="status"
        aria-live="polite"
      ></div>

      <section
        class="classroom"
        data-i18n-aria-label="classroom.aria"
      >
        <div class="front-wall">
          <div
            class="clock"
            role="img"
            data-i18n-aria-label="classroom.clock"
          ></div>
          <div
            class="window"
            role="img"
            data-i18n-aria-label="classroom.window"
          ></div>

          <div class="board">
            <div class="board-title" data-i18n="board.title">
              מספרים מכוונים
            </div>
            <div id="boardExercise" class="board-exercise">0 + 3</div>
            <div
              id="boardResult"
              class="board-result"
              aria-live="polite"
            ></div>
          </div>

          <div class="front-people">
            <div class="person teacher">
              <div
                id="speechBubble"
                class="speech-bubble"
                aria-live="polite"
              ></div>
              <div class="head"><div class="hair"></div></div>
              <div class="body"></div>
              <div class="legs"></div>
              <div class="person-label" data-i18n="people.teacher">
                המורה
              </div>
            </div>

            <div id="standingStudent" class="person active-student">
              <div class="head"><div class="hair"></div></div>
              <div class="body">
                <div class="direction-arrow" aria-hidden="true">↑</div>
              </div>
              <div class="legs"></div>
              <div class="person-label" data-i18n="people.student">
                התלמיד
              </div>
            </div>
          </div>
        </div>

        <div class="floor">
          <div
            id="studentDesks"
            class="student-desks"
            data-i18n-aria-label="classroom.students"
          ></div>

          <div class="number-line-area">
            <div
              id="numberLine"
              class="number-line"
              role="img"
              data-i18n-aria-label="numberLine.aria"
            >
              <div id="movingStudent" class="moving-student">
                <div class="head"><div class="hair"></div></div>
                <div class="body">
                  <div class="direction-arrow" aria-hidden="true">↑</div>
                </div>
                <div class="legs"></div>
                <div class="person-label" data-i18n="people.student">
                  התלמיד
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <div
        id="resultPanel"
        class="result-panel"
        role="status"
        aria-live="polite"
      ></div>
    </main>
  </div>

  <script src="js/i18n.js?v=bilingual-1"></script>
  <script src="js/app.js?v=bilingual-1"></script>
</body>
</html>
