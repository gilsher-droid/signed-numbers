<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Fundamatics – מספרים מכוונים</title>

  <style>
    :root {
      --dark-blue: #06283d;
      --blue: #0c4a6e;
      --light-blue: #d9edf7;
      --background: #eef4f7;
      --tile: #ffffff;
      --tile-border: #869aa5;
      --active: #ffd166;
      --visited: #cde8f5;
      --zero: #d8f3dc;
      --text: #16313f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: var(--background);
    }

    header {
      padding: 20px;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, var(--dark-blue), var(--blue));
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 30px;
    }

    header p {
      margin: 0;
      opacity: 0.9;
    }

    main {
      width: min(1150px, 95%);
      margin: 22px auto;
    }

    .message-box {
      min-height: 76px;
      margin-bottom: 16px;
      padding: 18px;
      border-radius: 16px;
      background: white;
      text-align: center;
      font-size: 22px;
      line-height: 1.5;
      box-shadow: 0 5px 16px rgba(0, 0, 0, 0.08);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: end;
      gap: 12px;
      margin-bottom: 18px;
      padding: 18px;
      border-radius: 16px;
      background: white;
      box-shadow: 0 5px 16px rgba(0, 0, 0, 0.08);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 140px;
    }

    label {
      font-weight: bold;
    }

    input,
    select,
    button {
      min-height: 45px;
      border-radius: 10px;
      font-size: 18px;
    }

    input,
    select {
      width: 100%;
      padding: 8px 10px;
      border: 2px solid #becdd4;
      background: white;
    }

    button {
      padding: 9px 20px;
      border: none;
      color: white;
      background: var(--blue);
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #12648f;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .secondary-button {
      background: #5d7079;
    }

    .classroom {
      position: relative;
      min-height: 410px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 30px 25px;
      border: 8px solid #8e7656;
      border-radius: 18px;
      background:
        linear-gradient(rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.45)),
        repeating-linear-gradient(
          90deg,
          #d5c9af 0,
          #d5c9af 78px,
          #bcae90 79px,
          #bcae90 81px
        );
      box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.22);
    }

    .starting-area {
      position: absolute;
      top: 25px;
      left: 50%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 35px;
      transform: translateX(-50%);
      z-index: 5;
    }

    .person {
      position: relative;
      width: 52px;
      height: 92px;
      transition:
        left 0.65s ease,
        bottom 0.65s ease,
        transform 0.65s ease,
        opacity 0.4s ease;
    }

    .head {
      width: 30px;
      height: 30px;
      margin: 0 auto;
      border: 2px solid #263842;
      border-radius: 50%;
      background: #f0bd91;
    }

    .body {
      position: relative;
      width: 38px;
      height: 48px;
      margin: -1px auto 0;
      border: 2px solid #263842;
      border-radius: 9px 9px 4px 4px;
    }

    .teacher .body {
      background: #384b55;
    }

    .student .body {
      background: #1565a7;
    }

    .person-label {
      position: absolute;
      width: 90px;
      bottom: -24px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-weight: bold;
      font-size: 15px;
    }

    .direction-arrow {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 22px;
    }

    .speech-bubble {
      position: absolute;
      top: -10px;
      right: 75px;
      width: 230px;
      padding: 12px;
      border: 2px solid #344b57;
      border-radius: 15px;
      background: white;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    .speech-bubble::after {
      content: "";
      position: absolute;
      bottom: -12px;
      right: 35px;
      width: 20px;
      height: 20px;
      border-right: 2px solid #344b57;
      border-bottom: 2px solid #344b57;
      background: white;
      transform: rotate(45deg);
    }

    .number-line {
      position: relative;
      display: flex;
      direction: ltr;
      width: max-content;
      min-width: 100%;
      justify-content: center;
      align-items: flex-end;
      padding-top: 260px;
    }

    .tile {
      position: relative;
      flex: 0 0 78px;
      height: 95px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 13px;
      border: 2px solid var(--tile-border);
      background: var(--tile);
      font-size: 22px;
      font-weight: bold;
      transition:
        background 0.3s ease,
        transform 0.3s ease;
    }

    .tile.zero {
      background: var(--zero);
    }

    .tile.visited {
      background: var(--visited);
    }

    .tile.active {
      background: var(--active);
      transform: translateY(-5px);
    }

    .moving-student {
      position: absolute;
      bottom: 72px;
      left: 50%;
      width: 52px;
      height: 92px;
      transform-origin: center center;
      transition:
        left 0.65s ease,
        transform 0.65s ease,
        opacity 0.4s ease;
      opacity: 0;
      z-index: 10;
    }

    .exercise {
      margin: 18px 0 10px;
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      direction: ltr;
    }

    .result {
      min-height: 60px;
      margin-top: 16px;
      padding: 15px;
      border-radius: 14px;
      background: white;
      text-align: center;
      font-size: 27px;
      font-weight: bold;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    }

    .hidden {
      display: none;
    }

    @media (max-width: 700px) {
      header h1 {
        font-size: 24px;
      }

      .message-box {
        font-size: 19px;
      }

      .speech-bubble {
        width: 180px;
        right: 55px;
        font-size: 15px;
      }

      .controls {
        align-items: stretch;
      }

      .field {
        width: 100%;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Fundamatics</h1>
    <p>סימולטור גופני ללימוד מספרים מכוונים</p>
  </header>

  <main>
    <div id="messageBox" class="message-box">
      המורה והתלמיד עומדים יחד מחוץ לציר המספרים.
    </div>

    <section id="startControls" class="controls">
      <div class="field">
        <label for="startingNumber">מאיזו בלטה תרצה להתחיל?</label>
        <input
          id="startingNumber"
          type="number"
          value="0"
          min="-50"
          max="50"
          step="1"
        />
      </div>

      <button id="chooseTileButton">בחר את הבלטה</button>
    </section>

    <section id="exerciseControls" class="controls hidden">
      <div class="field">
        <label for="operator">סימן הפעולה</label>
        <select id="operator">
          <option value="+">+</option>
          <option value="-">−</option>
        </select>
      </div>

      <div class="field">
        <label for="secondNumber">המספר השני</label>
        <input
          id="secondNumber"
          type="number"
          value="3"
          min="-50"
          max="50"
          step="1"
        />
      </div>

      <button id="runButton">בצע את התרגיל</button>
      <button id="newExerciseButton" class="secondary-button">
        תרגיל חדש מאותה בלטה
      </button>
      <button id="resetButton" class="secondary-button">
        התחל מחדש
      </button>
    </section>

    <div id="exercise" class="exercise"></div>

    <section id="classroom" class="classroom">
      <div id="startingArea" class="starting-area">
        <div class="person teacher">
          <div class="speech-bubble">
            מאיזו בלטה אתה רוצה להתחיל?
          </div>

          <div class="head"></div>

          <div class="body"></div>

          <div class="person-label">המורה</div>
        </div>

        <div id="waitingStudent" class="person student">
          <div class="head"></div>

          <div class="body">
            <div class="direction-arrow">↑</div>
          </div>

          <div class="person-label">התלמיד</div>
        </div>
      </div>

      <div id="numberLine" class="number-line">
        <div id="movingStudent" class="moving-student student">
          <div class="head"></div>

          <div class="body">
            <div class="direction-arrow">↑</div>
          </div>

          <div class="person-label">התלמיד</div>
        </div>
      </div>
    </section>

    <div id="result" class="result"></div>
  </main>

  <script>
    const startingNumberInput =
      document.getElementById("startingNumber");

    const operatorInput =
      document.getElementById("operator");

    const secondNumberInput =
      document.getElementById("secondNumber");

    const chooseTileButton =
      document.getElementById("chooseTileButton");

    const runButton =
      document.getElementById("runButton");

    const newExerciseButton =
      document.getElementById("newExerciseButton");

    const resetButton =
      document.getElementById("resetButton");

    const startControls =
      document.getElementById("startControls");

    const exerciseControls =
      document.getElementById("exerciseControls");

    const messageBox =
      document.getElementById("messageBox");

    const exerciseBox =
      document.getElementById("exercise");

    const resultBox =
      document.getElementById("result");

    const numberLine =
      document.getElementById("numberLine");

    const startingArea =
      document.getElementById("startingArea");

    const waitingStudent =
      document.getElementById("waitingStudent");

    const movingStudent =
      document.getElementById("movingStudent");

    const TILE_WIDTH = 78;

    let tiles = [];
    let minimumTile = -10;
    let maximumTile = 10;
    let currentPosition = 0;
    let currentRotation = 0;
    let isRunning = false;
    let studentIsOnLine = false;

    function sleep(milliseconds) {
      return new Promise(resolve => {
        setTimeout(resolve, milliseconds);
      });
    }

    function calculateResult(firstNumber, operator, secondNumber) {
      return operator === "+"
        ? firstNumber + secondNumber
        : firstNumber - secondNumber;
    }

    function formatSecondNumber(number) {
      return number < 0 ? `(${number})` : `${number}`;
    }

    function createNumberLine(firstNumber, finalNumber = firstNumber) {
      minimumTile = Math.min(
        -10,
        firstNumber - 4,
        finalNumber - 4
      );

      maximumTile = Math.max(
        10,
        firstNumber + 4,
        finalNumber + 4
      );

      numberLine
        .querySelectorAll(".tile")
        .forEach(tile => tile.remove());

      tiles = [];

      for (
        let number = minimumTile;
        number <= maximumTile;
        number += 1
      ) {
        const tile = document.createElement("div");

        tile.className = "tile";
        tile.dataset.number = number;
        tile.textContent = number;

        if (number === 0) {
          tile.classList.add("zero");
        }

        numberLine.appendChild(tile);
        tiles.push(tile);
      }

      numberLine.appendChild(movingStudent);
    }

    function getTile(number) {
      return tiles.find(tile => {
        return Number(tile.dataset.number) === number;
      });
    }

    function getStudentLeftPosition(number) {
      const tileIndex = number - minimumTile;

      return tileIndex * TILE_WIDTH + TILE_WIDTH / 2;
    }

    function clearTileHighlights() {
      tiles.forEach(tile => {
        tile.classList.remove("active", "visited");
      });
    }

    function highlightCurrentTile(number) {
      const tile = getTile(number);

      if (!tile) {
        return;
      }

      tile.classList.add("active");

      tile.scrollIntoView({
        behavior: "smooth",
        inline: "center",
        block: "nearest"
      });
    }

    function placeStudentOnTile(number) {
      currentPosition = number;
      currentRotation = 0;

      movingStudent.style.left =
        `${getStudentLeftPosition(number)}px`;

      movingStudent.style.transform =
        "translateX(-50%) rotate(0deg)";

      movingStudent.style.opacity = "1";

      waitingStudent.style.opacity = "0";

      clearTileHighlights();
      highlightCurrentTile(number);
    }

    function updateExerciseText() {
      if (!studentIsOnLine) {
        exerciseBox.textContent = "";
        return;
      }

      const operator = operatorInput.value;
      const secondNumber = Number(secondNumberInput.value);

      exerciseBox.textContent =
        `${currentPosition} ${operator} ${formatSecondNumber(secondNumber)}`;
    }

    function validateInteger(value) {
      return Number.isInteger(value) && Math.abs(value) <= 50;
    }

    async function chooseStartingTile() {
      if (isRunning) {
        return;
      }

      const startingNumber =
        Number(startingNumberInput.value);

      if (!validateInteger(startingNumber)) {
        messageBox.textContent =
          "יש לבחור מספר שלם בין מינוס 50 ל־50.";
        return;
      }

      isRunning = true;
      chooseTileButton.disabled = true;

      createNumberLine(startingNumber);

      messageBox.textContent =
        `בחרת להתחיל מהבלטה ${startingNumber}. ` +
        "התלמיד ניגש אל הבלטה.";

      await sleep(900);

      placeStudentOnTile(startingNumber);

      await sleep(700);

      studentIsOnLine = true;

      messageBox.textContent =
        `התלמיד עומד על הבלטה ${startingNumber} ` +
        "ופניו אל המורה.";

      startingArea.style.opacity = "0.45";

      startControls.classList.add("hidden");
      exerciseControls.classList.remove("hidden");

      resultBox.textContent = "";
      updateExerciseText();

      chooseTileButton.disabled = false;
      isRunning = false;
    }

    async function runSimulation() {
      if (isRunning || !studentIsOnLine) {
        return;
      }

      const firstNumber = currentPosition;
      const operator = operatorInput.value;
      const secondNumber = Number(secondNumberInput.value);

      if (!validateInteger(secondNumber)) {
        messageBox.textContent =
          "יש להזין מספר שני שלם בין מינוס 50 ל־50.";
        return;
      }

      const result = calculateResult(
        firstNumber,
        operator,
        secondNumber
      );

      if (Math.abs(result) > 100) {
        messageBox.textContent =
          "התוצאה גדולה מדי עבור הציר הנוכחי.";
        return;
      }

      isRunning = true;
      runButton.disabled = true;
      newExerciseButton.disabled = true;
      resultBox.textContent = "";

      createNumberLine(firstNumber, result);
      placeStudentOnTile(firstNumber);
      updateExerciseText();

      messageBox.textContent =
        `המספר הראשון הוא ${firstNumber}. ` +
        `התלמיד נמצא על הבלטה ${firstNumber}.`;

      await sleep(1400);

      const turnAmount = operator === "+" ? 90 : -90;
      const turnDirection =
        operator === "+" ? "ימינה" : "שמאלה";

      currentRotation += turnAmount;

      messageBox.textContent =
        `מופיע הסימן ${operator}. ` +
        `התלמיד מסתובב 90 מעלות ${turnDirection}.`;

      movingStudent.style.transform =
        `translateX(-50%) rotate(${currentRotation}deg)`;

      await sleep(1500);

      const numberOfSteps = Math.abs(secondNumber);
      const walkingDirection =
        secondNumber >= 0 ? "קדימה" : "אחורה";

      messageBox.textContent =
        `המספר השני הוא ${secondNumber}. ` +
        `התלמיד הולך ${numberOfSteps} צעדים ${walkingDirection}.`;

      await sleep(1200);

      const directionOnNumberLine =
        operator === "+"
          ? Math.sign(secondNumber)
          : -Math.sign(secondNumber);

      for (
        let step = 0;
        step < numberOfSteps;
        step += 1
      ) {
        const oldTile = getTile(currentPosition);

        if (oldTile) {
          oldTile.classList.remove("active");
          oldTile.classList.add("visited");
        }

        currentPosition += directionOnNumberLine;

        movingStudent.style.left =
          `${getStudentLeftPosition(currentPosition)}px`;

        const currentTile = getTile(currentPosition);

        if (currentTile) {
          currentTile.classList.add("active");

          currentTile.scrollIntoView({
            behavior: "smooth",
            inline: "center",
            block: "nearest"
          });
        }

        await sleep(650);
      }

      messageBox.textContent =
        `התלמיד הגיע לבלטה שעליה כתוב ${currentPosition}.`;

      resultBox.textContent =
        `${firstNumber} ${operator} ` +
        `${formatSecondNumber(secondNumber)} = ${currentPosition}`;

      runButton.disabled = false;
      newExerciseButton.disabled = false;
      isRunning = false;
    }

    function prepareNewExercise() {
      if (isRunning || !studentIsOnLine) {
        return;
      }

      currentRotation = 0;

      movingStudent.style.transform =
        "translateX(-50%) rotate(0deg)";

      clearTileHighlights();
      highlightCurrentTile(currentPosition);

      operatorInput.value = "+";
      secondNumberInput.value = 3;

      resultBox.textContent = "";

      messageBox.textContent =
        `התלמיד נמצא עכשיו על הבלטה ${currentPosition}. ` +
        "אפשר לבחור את הפעולה הבאה.";

      updateExerciseText();
    }

    function resetSimulator() {
      if (isRunning) {
        return;
      }

      studentIsOnLine = false;
      currentPosition = 0;
      currentRotation = 0;

      startingNumberInput.value = 0;
      operatorInput.value = "+";
      secondNumberInput.value = 3;

      startControls.classList.remove("hidden");
      exerciseControls.classList.add("hidden");

      startingArea.style.opacity = "1";
      waitingStudent.style.opacity = "1";
      movingStudent.style.opacity = "0";

      exerciseBox.textContent = "";
      resultBox.textContent = "";

      messageBox.textContent =
        "המורה והתלמיד עומדים יחד מחוץ לציר המספרים.";

      createNumberLine(0);
      clearTileHighlights();
    }

    chooseTileButton.addEventListener(
      "click",
      chooseStartingTile
    );

    runButton.addEventListener(
      "click",
      runSimulation
    );

    newExerciseButton.addEventListener(
      "click",
      prepareNewExercise
    );

    resetButton.addEventListener(
      "click",
      resetSimulator
    );

    operatorInput.addEventListener(
      "change",
      updateExerciseText
    );

    secondNumberInput.addEventListener(
      "input",
      updateExerciseText
    );

    resetSimulator();
  </script>
</body>
</html>
